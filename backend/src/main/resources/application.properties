spring.application.name=backend


spring.datasource.url=jdbc:mysql://localhost:3306/balirajahub
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
server.port=8080

# ===========================
# JWT Configuration
# ===========================
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

logging.level.org.springframework.security=DEBUG

# =====================================ye
# Maximum upload size
# =====================================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# =====================================
# Market-API
# =====================================

market.api.key=${MARKET_API_KEY}
market.api.url=https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070

# =====================================
# OpenWeather API
# =====================================
weather.api.key=${OPENWEATHER_API_KEY}

# =====================================
# AI Advisory (OpenRouter + Gemini)
# =====================================

gemini.api-key=${OPENROUTER_API_KEY}
gemini.model=meta-llama/llama-3.1-8b-instruct
gemini.base-url=https://openrouter.ai/api/v1/chat/completions


# =====================================
# Swagger / OpenAPI
# =====================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha